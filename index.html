<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearLedger — Expense Tracker</title>
    <meta
      name="description"
      content="Clean, modern financial dashboard for tracking income, expenses, budgets, and spending analytics."
    />
    <meta property="og:title" content="ClearLedger — Expense Tracker" />
    <meta
      property="og:description"
      content="Clean, modern financial dashboard for tracking income, expenses, budgets, and spending analytics."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

      <aside class="sidebar" id="sidebar" aria-label="Primary Navigation">
        <div class="sidebar-brand">
          <a href="#dashboard" class="brand-link" data-nav="dashboard">
            <img src="/assets/logo.svg" alt="ClearLedger mark" class="brand-logo" width="28" height="28" />
            <span class="brand-name">ClearLedger</span>
          </a>
          <button
            type="button"
            class="icon-btn mobile-close-btn"
            id="sidebar-close-btn"
            aria-label="Close navigation menu"
          >
            <i data-lucide="x"></i>
          </button>
        </div>

        <nav class="sidebar-nav" aria-label="Dashboard sections">
          <button type="button" class="nav-item active" data-view="dashboard" aria-current="page">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
          </button>
          <button type="button" class="nav-item" data-view="transactions">
            <i data-lucide="arrow-left-right"></i>
            <span>Transactions</span>
          </button>
          <button type="button" class="nav-item" data-view="analytics">
            <i data-lucide="bar-chart-3"></i>
            <span>Analytics</span>
          </button>
          <button type="button" class="nav-item" data-view="budget">
            <i data-lucide="wallet"></i>
            <span>Budget</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-footer-label">Data Controls</div>
          <button type="button" class="utility-btn" id="btn-export-csv">
            <i data-lucide="download"></i>
            <span>Export CSV</span>
          </button>
          <button type="button" class="utility-btn" id="btn-reset-sample">
            <i data-lucide="rotate-ccw"></i>
            <span>Load Sample Data</span>
          </button>
          <button type="button" class="utility-btn utility-btn-danger" id="btn-clear-data">
            <i data-lucide="trash-2"></i>
            <span>Clear All Data</span>
          </button>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div class="topbar-left">
            <button
              type="button"
              class="icon-btn mobile-menu-btn"
              id="sidebar-open-btn"
              aria-label="Open navigation menu"
              aria-controls="sidebar"
              aria-expanded="false"
            >
              <i data-lucide="menu"></i>
            </button>
            <div class="breadcrumb" id="topbar-breadcrumb">
              <span class="breadcrumb-root">Finance</span>
              <span class="breadcrumb-sep" aria-hidden="true">/</span>
              <h1 class="breadcrumb-current" id="view-title">Dashboard</h1>
            </div>
          </div>

          <div class="topbar-actions">
            <div class="month-picker-wrap">
              <label for="global-month-select" class="sr-only">Active Month</label>
              <select id="global-month-select" class="select-control select-compact" aria-label="Select month">
              </select>
            </div>
            <button type="button" class="btn btn-primary" id="btn-open-add-modal">
              <i data-lucide="plus"></i>
              <span>Add Transaction</span>
            </button>
          </div>
        </header>

        <main class="content-area" id="app-content">
          <section id="view-dashboard" class="view-section active" aria-labelledby="view-title"></section>
          <section id="view-transactions" class="view-section" hidden></section>
          <section id="view-analytics" class="view-section" hidden></section>
          <section id="view-budget" class="view-section" hidden></section>
        </main>
      </div>
    </div>

    <!-- Add / Edit Transaction Modal -->
    <div
      class="modal-overlay"
      id="transaction-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tx-modal-title"
      hidden
    >
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 class="modal-title" id="tx-modal-title">Add Transaction</h2>
          <button type="button" class="icon-btn" id="tx-modal-close" aria-label="Close modal">
            <i data-lucide="x"></i>
          </button>
        </div>

        <form id="transaction-form" novalidate>
          <input type="hidden" id="tx-id" name="id" value="" />

          <div class="form-group">
            <span class="form-label">Transaction Type</span>
            <div class="segmented-control" role="radiogroup" aria-label="Transaction type">
              <button type="button" class="segment-btn active" data-tx-type="expense" aria-checked="true" role="radio">
                Expense
              </button>
              <button type="button" class="segment-btn" data-tx-type="income" aria-checked="false" role="radio">
                Income
              </button>
            </div>
            <input type="hidden" id="tx-type" name="type" value="expense" />
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label for="tx-title" class="form-label">Title <span class="req">*</span></label>
              <input
                type="text"
                id="tx-title"
                name="title"
                class="input-control"
                placeholder="e.g., Grocery Shopping"
                maxlength="80"
                required
              />
              <span class="field-error" id="err-tx-title" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="tx-amount" class="form-label">Amount ($) <span class="req">*</span></label>
              <input
                type="number"
                id="tx-amount"
                name="amount"
                class="input-control mono-input"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                required
              />
              <span class="field-error" id="err-tx-amount" role="alert"></span>
            </div>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label for="tx-category" class="form-label">Category <span class="req">*</span></label>
              <select id="tx-category" name="category" class="select-control" required></select>
              <span class="field-error" id="err-tx-category" role="alert"></span>
            </div>

            <div class="form-group">
              <label for="tx-date" class="form-label">Date <span class="req">*</span></label>
              <input type="date" id="tx-date" name="date" class="input-control mono-input" required />
              <span class="field-error" id="err-tx-date" role="alert"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="tx-description" class="form-label">Description</label>
            <textarea
              id="tx-description"
              name="description"
              class="input-control textarea-control"
              rows="2"
              maxlength="200"
              placeholder="Optional notes (e.g., Weekly groceries at market)"
            ></textarea>
            <span class="field-error" id="err-tx-description" role="alert"></span>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="tx-modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary" id="tx-modal-submit">Save Transaction</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div
      class="modal-overlay"
      id="confirm-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
      hidden
    >
      <div class="modal-dialog modal-dialog-sm">
        <div class="modal-header">
          <h2 class="modal-title" id="confirm-modal-title">Confirm Action</h2>
          <button type="button" class="icon-btn" id="confirm-modal-close" aria-label="Close dialog">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="modal-body">
          <p class="confirm-message" id="confirm-modal-message"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="confirm-modal-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirm-modal-accept">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Toast Region -->
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
